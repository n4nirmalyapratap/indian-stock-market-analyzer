services:
  postgres:
    image: postgres:17-alpine
    container_name: stock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-niftynode}"
      POSTGRES_USER: "${POSTGRES_USER:-niftynode}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-niftynode} -d ${POSTGRES_DB:-niftynode}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./artifacts/python-backend
      dockerfile: Dockerfile
    container_name: stock-backend
    restart: unless-stopped
    environment:
      PORT: "8090"
      SESSION_SECRET: "${SESSION_SECRET}"
      DATABASE_URL: "${DATABASE_URL}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      ADMIN_GOOGLE_EMAILS: "${ADMIN_GOOGLE_EMAILS}"
      FRED_API_KEY: "${FRED_API_KEY:-}"
      AI_INTEGRATIONS_OPENROUTER_API_KEY: "${AI_INTEGRATIONS_OPENROUTER_API_KEY:-}"
      AI_INTEGRATIONS_OPENROUTER_BASE_URL: "${AI_INTEGRATIONS_OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
      AI_INTEGRATIONS_OPENAI_API_KEY: "${AI_INTEGRATIONS_OPENAI_API_KEY:-}"
      AI_INTEGRATIONS_OPENAI_BASE_URL: "${AI_INTEGRATIONS_OPENAI_BASE_URL:-}"
      AI_MODEL: "${AI_MODEL:-}"
      AI_FALLBACK_MODEL: "${AI_FALLBACK_MODEL:-}"
      FEATURE_AI_ANALYST: "${FEATURE_AI_ANALYST:-on}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/api/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: artifacts/stock-market-app/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: "${VITE_GOOGLE_CLIENT_ID}"
    container_name: stock-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
