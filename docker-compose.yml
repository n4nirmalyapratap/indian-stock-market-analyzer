services:
  postgres:
    image: postgres:17-alpine
    container_name: stock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-niftynode}"
      POSTGRES_USER: "${POSTGRES_USER:-niftynode}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-niftynode} -d ${POSTGRES_DB:-niftynode}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./artifacts/python-backend
      dockerfile: Dockerfile
    container_name: stock-backend
    restart: unless-stopped
    environment:
      PORT: "8090"
      SESSION_SECRET: "${SESSION_SECRET}"
      DATABASE_URL: "${DATABASE_URL}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      ADMIN_GOOGLE_EMAILS: "${ADMIN_GOOGLE_EMAILS}"
      FRED_API_KEY: "${FRED_API_KEY:-}"
      AI_INTEGRATIONS_OPENROUTER_API_KEY: "${AI_INTEGRATIONS_OPENROUTER_API_KEY:-}"
      AI_INTEGRATIONS_OPENROUTER_BASE_URL: "${AI_INTEGRATIONS_OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
      AI_INTEGRATIONS_OPENAI_API_KEY: "${AI_INTEGRATIONS_OPENAI_API_KEY:-}"
      AI_INTEGRATIONS_OPENAI_BASE_URL: "${AI_INTEGRATIONS_OPENAI_BASE_URL:-}"
      AI_MODEL: "${AI_MODEL:-}"
      AI_FALLBACK_MODEL: "${AI_FALLBACK_MODEL:-}"
      KIMCHI_API_KEY: "${KIMCHI_API_KEY:-}"
      KIMCHI_BASE_URL: "${KIMCHI_BASE_URL:-https://llm.kimchi.dev/openai/v1}"
      KIMCHI_MODEL: "${KIMCHI_MODEL:-}"
      FEATURE_AI_ANALYST: "${FEATURE_AI_ANALYST:-on}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
      # ── Dev debugging flags ──────────────────────────────────────
      # SHAREHOLDING_DISABLE_CACHE=1 forces every /stocks/{sym}/shareholding
      # request to re-run the NSE→XBRL→Yahoo→Screener chain instead of
      # serving from the PG cache. Use while triaging which source is
      # failing — comment this line out (or set to 0) before merging to
      # production. Logs emit a WARNING line at startup when it's active.
      SHAREHOLDING_DISABLE_CACHE: "${SHAREHOLDING_DISABLE_CACHE:-0}"
      # LOG_LEVEL — overrides the root logger level. Defaults to INFO if
      # unset. Bump to DEBUG temporarily for noisy network traces.
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      # Forces Python to line-buffer stdout so `docker logs -f` shows
      # application INFO lines in real time (without this, output may
      # be batched in 4KB chunks and appear delayed/missing).
      PYTHONUNBUFFERED: "1"
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/api/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: artifacts/stock-market-app/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: "${VITE_GOOGLE_CLIENT_ID}"
    container_name: stock-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
