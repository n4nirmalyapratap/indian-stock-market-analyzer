services:
  postgres:
    image: postgres:17-alpine
    container_name: stock-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-niftynode}"
      POSTGRES_USER: "${POSTGRES_USER:-niftynode}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-niftynode} -d ${POSTGRES_DB:-niftynode}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./artifacts/python-backend
      dockerfile: Dockerfile
    container_name: stock-backend-dev
    restart: unless-stopped
    working_dir: /app
    command: uvicorn main:app --host 0.0.0.0 --port 8090 --reload
    environment:
      PORT: "8090"
      PYTHONPATH: /app
      WATCHFILES_FORCE_POLLING: "true"
      SESSION_SECRET: "${SESSION_SECRET}"
      DATABASE_URL: "${DATABASE_URL}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      ADMIN_GOOGLE_EMAILS: "${ADMIN_GOOGLE_EMAILS}"
      FRED_API_KEY: "${FRED_API_KEY:-}"
      AI_INTEGRATIONS_OPENROUTER_API_KEY: "${AI_INTEGRATIONS_OPENROUTER_API_KEY:-}"
      AI_INTEGRATIONS_OPENROUTER_BASE_URL: "${AI_INTEGRATIONS_OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
      AI_INTEGRATIONS_OPENAI_API_KEY: "${AI_INTEGRATIONS_OPENAI_API_KEY:-}"
      AI_INTEGRATIONS_OPENAI_BASE_URL: "${AI_INTEGRATIONS_OPENAI_BASE_URL:-}"
      AI_MODEL: "${AI_MODEL:-}"
      AI_FALLBACK_MODEL: "${AI_FALLBACK_MODEL:-}"
      KIMCHI_API_KEY: "${KIMCHI_API_KEY:-}"
      KIMCHI_BASE_URL: "${KIMCHI_BASE_URL:-https://llm.kimchi.dev/openai/v1}"
      KIMCHI_MODEL: "${KIMCHI_MODEL:-}"
      FEATURE_AI_ANALYST: "${FEATURE_AI_ANALYST:-on}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
      # ── Dev debugging flags ──────────────────────────────────────
      # SHAREHOLDING_DISABLE_CACHE=1 forces every /stocks/{sym}/shareholding
      # request to re-run the NSE→XBRL→Yahoo→Screener chain instead of
      # serving from the PG cache. Use while triaging which source is
      # failing — comment this line out (or set to 0) before merging to
      # production. Logs emit a WARNING line at startup when it's active.
      SHAREHOLDING_DISABLE_CACHE: "${SHAREHOLDING_DISABLE_CACHE:-1}"
      # LOG_LEVEL — overrides the root logger level. Defaults to INFO if
      # unset. Bump to DEBUG temporarily for noisy network traces.
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      # Forces Python to line-buffer stdout so `docker logs -f` shows
      # application INFO lines in real time (without this, output may
      # be batched in 4KB chunks and appear delayed/missing).
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./artifacts/python-backend:/app
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy

  user-frontend:
    image: node:24-slim
    container_name: stock-user-frontend-dev
    restart: unless-stopped
    working_dir: /workspace
    command: >
      sh -lc "npm install -g pnpm@10.33.0 &&
      pnpm install --no-frozen-lockfile &&
      PORT=3002 BASE_PATH=/ VITE_API_PROXY_TARGET=http://backend:8090
      pnpm --filter @workspace/stock-market-app run dev"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
      VITE_GOOGLE_CLIENT_ID: "${VITE_GOOGLE_CLIENT_ID}"
    volumes:
      - .:/workspace
      - pnpm-store:/root/.local/share/pnpm/store
      - user-workspace-node-modules:/workspace/node_modules
    depends_on:
      - backend
    ports:
      - "3002:3002"

  admin-frontend:
    image: node:24-slim
    container_name: stock-admin-frontend-dev
    restart: unless-stopped
    working_dir: /workspace
    command: >
      sh -lc "npm install -g pnpm@10.33.0 &&
      pnpm install --no-frozen-lockfile &&
      PORT=22133 BASE_PATH=/admin/ VITE_API_PROXY_TARGET=http://backend:8090
      pnpm --filter @workspace/admin-dashboard run dev"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
      VITE_GOOGLE_CLIENT_ID: "${VITE_GOOGLE_CLIENT_ID}"
    volumes:
      - .:/workspace
      - pnpm-store:/root/.local/share/pnpm/store
      - admin-workspace-node-modules:/workspace/node_modules
    depends_on:
      - backend
    ports:
      - "22133:22133"

  proxy:
    image: nginx:alpine
    container_name: stock-dev-proxy
    restart: unless-stopped
    depends_on:
      - backend
      - user-frontend
      - admin-frontend
    volumes:
      - ./artifacts/stock-market-app/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"

volumes:
  postgres-data-dev:
  pnpm-store:
  user-workspace-node-modules:
  admin-workspace-node-modules:
